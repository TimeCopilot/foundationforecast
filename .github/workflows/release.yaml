name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file "docs/changelogs/${{ github.ref_name }}.md"

  pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Perform import test (wheel)
        run: uv run --isolated --no-project -p 3.13 --with dist/*.whl -- python -c "from foundationforecast import FoundationForecast; from foundationforecast.models import Chronos"

      - name: Perform import test (source distribution)
        run: uv run --isolated --no-project -p 3.13 --with dist/*.tar.gz -- python -c "from foundationforecast import FoundationForecast; from foundationforecast.models import Chronos"

      - name: Publish package
        run: uv publish --trusted-publishing always

      - name: After publishing test
        run: uv run --isolated --no-project -p 3.13 --with foundationforecast -- python -c "from foundationforecast import FoundationForecast; from foundationforecast.models import Chronos"
