name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.python-version }}${{ matrix.coverage && ' (coverage)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            coverage: false
          - python-version: "3.11"
            coverage: false
          - python-version: "3.12"
            coverage: true
          - python-version: "3.13"
            coverage: false
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Free disk space in action runner
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"
          rmz_version: "3.1.1"

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          key: ${{ runner.os }}-huggingface-${{ hashFiles('**/tests/') }}

      - name: Run tests
        run: uv run pytest ${{ matrix.coverage && '--cov=foundationforecast --cov-report=term-missing' || '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Test import FoundationForecast and Chronos
        run: uv run -- python -c "from foundationforecast import FoundationForecast; from foundationforecast.models import Chronos"

  test-docs:
    name: test docs
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run docs tests
        run: uv run --group docs pytest -m docs -o addopts= -x -n 0

  build-docs:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build docs
        run: uv run --group docs mkdocs build

  lint:
    name: lint and style checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test-gift-eval:
    name: test gift-eval replication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/gift-eval
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run GIFT-Eval CI subset on Modal
        run: uv run modal run -m src.runners.run_modal::run_ci
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync CI results from S3
        run: make sync-ci-results

      - name: Verify replication
        run: uv run pytest tests/test_replication.py -n 0 -x
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
