name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Free disk space in action runner
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"
          rmz_version: "3.1.1"

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          key: ${{ runner.os }}-huggingface-${{ hashFiles('**/tests/') }}

      - name: Run tests
        run: uv run pytest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        name: Test import class
        run: uv run -- python -c "from foundationforecast import FoundationForecast; from foundationforecast.models import Chronos" 

  lint:
    name: lint and style checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
