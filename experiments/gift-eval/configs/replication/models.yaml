# Notebook-aligned params for replication runs only (see configs/replication/notebooks.yaml).
models:
  google--timesfm-3.0-pytorch:
    class: foundationforecast.models.timesfm.TimesFM
    reference_slug: TimesFM-3
    kwargs:
      repo_id: google/timesfm-3.0-pytorch
      alias: TimesFM-3
      context_length: 15360
      batch_size: 64
      input_patch_length: 32
      output_patch_length: 64
      use_variate_attention: true
      use_sdpa: true

  Salesforce--moirai-2.0-R-small:
    class: foundationforecast.models.moirai.Moirai
    reference_slug: Moirai2
    predictor_batch_size: 2048
    kwargs:
      repo_id: Salesforce/moirai-2.0-R-small
      context_length: 4000
      batch_size: 2048

  Datadog--Toto-2.0-313m:
    class: foundationforecast.models.toto.Toto
    reference_slug: Toto-2.0-313m
    kwargs:
      repo_id: Datadog/Toto-2.0-313m
      context_length: 4096
      batch_size: 512

  NX-AI--TiRex-2-gifteval-zs:
    class: foundationforecast.models.tirex.TiRex
    reference_slug: TiRex-2-Zeroshot
    predictor_batch_size: 512
    kwargs:
      repo_id: NX-AI/TiRex-2-gifteval-zs
      batch_size: 512

  ibm-granite--granite-timeseries-patchtst-fm-r2:
    class: foundationforecast.models.patchtst_fm.PatchTSTFM
    reference_slug: Granite-PatchTST-FM-r2
    max_length: 8192
    kwargs:
      repo_id: ibm-granite/granite-timeseries-patchtst-fm-r2
      context_length: 8192
      batch_size: 32

  theforecastingcompany--t0-beta:
    class: foundationforecast.models.t0.T0
    reference_slug: t0-beta
    kwargs:
      repo_id: theforecastingcompany/t0-beta
      alias: t0-beta
      context_length: 8192
      batch_size: 64

  tafsut-univariate-base:
    class: foundationforecast.models.tafsut.Tafsut
    reference_slug: tafsut
    kwargs:
      repo_id: Tafsut-FM/tafsut-univariate-base
      alias: tafsut
      batch_size: 128
