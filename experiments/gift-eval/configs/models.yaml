# Model registry for GIFT-Eval runs and replication checks.
#
# Identifiers (four roles — do not collapse them):
#   model_key        — slugified repo_id (org--model); drives results/, S3, ci_subset.yaml
#   kwargs.repo_id   — Hugging Face hub path to load weights (org/model)
#   reference_slug   — official GIFT-Eval results folder on the leaderboard HF space
#   kwargs.alias     — auto-set from reference_slug unless set explicitly in kwargs;
#                      must match the reference CSV "model" column (can differ from folder slug)
#
# Picking repo_id:
#   - Use the weights from GIFT-Eval results/{reference_slug}/config.json → model_link
#     (many models publish gifteval-specific HF repos, e.g. NX-AI/TiRex-1.1-gifteval).
#   - Moirai 1.x leaderboard entries use moirai-1.1-R-* checkpoints, not moirai-1.0-R-*.
#
# Picking reference_slug:
#   - Must match GIFT-Eval's published names, NOT repo_id (org prefix often omitted).
#   - Verify at:
#       https://huggingface.co/spaces/Salesforce/GIFT-Eval/tree/main/results/{reference_slug}
#   - Set reference_slug: null if no public reference (verify skips).
#
# model_key = repo_id with "/" replaced by "--". When one repo_id maps to multiple
# leaderboard entries (e.g. TiRex-2 Pretrained vs Zeroshot), suffix with --{reference_slug}.
# Do not use raw org/model as model_key — slashes break results/ and S3 paths.

models:
  # --- Chronos ---
  amazon--chronos-bolt-small:
    class: foundationforecast.models.chronos.Chronos
    reference_slug: chronos_bolt_small
    kwargs:
      repo_id: amazon/chronos-bolt-small
