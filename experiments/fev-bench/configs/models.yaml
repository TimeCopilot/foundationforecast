# model_key = repo_id with "/" -> "--"
# Native futr exog + fev-bench leaderboard CSV for replication.
models:
  amazon--chronos-2:
    class: foundationforecast.models.chronos.Chronos
    reference_csv: chronos-2.csv
    kwargs:
      repo_id: amazon/chronos-2
      batch_size: 64

  google--timesfm-3.0-pytorch:
    class: foundationforecast.models.timesfm.TimesFM
    reference_csv: timesfm-3.csv
    kwargs:
      repo_id: google/timesfm-3.0-pytorch
      alias: TimesFM-3
      context_length: 15360
      batch_size: 64

  theforecastingcompany--t0-beta:
    class: foundationforecast.models.t0.T0
    reference_csv: t0-beta.csv
    kwargs:
      repo_id: theforecastingcompany/t0-beta
      alias: t0-beta
      batch_size: 16

  NX-AI--TiRex-2:
    class: foundationforecast.models.tirex.TiRex
    reference_csv: tirex-2.csv
    kwargs:
      repo_id: NX-AI/TiRex-2
      alias: TiRex-2
      batch_size: 64
