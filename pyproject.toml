[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pre-commit",
  "pytest-cov>=6.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "pytest>=8.0",
  "ruff>=0.12",
]

[project]
authors = [
  {email = "azul.garza.r@gmail.com", name = "Azul Garza"},
]
dependencies = [
  "gluonts[torch]",
  "huggingface-hub>=0.36.2,<2.0",
  "nixtla>=0.7.0",
  "pandas>=2.2.0 ; python_full_version >= '3.13'",
  "scipy",
  "tabpfn-time-series==1.0.3 ; python_full_version < '3.13'",
  "tfc-t0>=0.2.3 ; python_full_version >= '3.11' and python_full_version < '3.14'",
  "timecopilot-chronos-forecasting>=0.2.2",
  "timecopilot-granite-tsfm>=0.2.1 ; python_full_version >= '3.11' and python_full_version < '3.14'",
  "timecopilot-timesfm>=0.3.0",
  "timecopilot-tirex2>=0.1.0 ; python_full_version >= '3.11'",
  "timecopilot-tirex>=0.1.1 ; python_full_version >= '3.11'",
  "timecopilot-toto-2>=0.1.1",
  "timecopilot-toto>=0.1.7",
  "timecopilot-uni2ts>=0.1.3 ; python_full_version < '3.14'",
  "torch",
  "transformers>=4.41,<6 ; python_full_version < '3.13'",
  "transformers>=4.48,<6 ; python_full_version >= '3.13'",
  "utilsforecast>=0.2.15",
]
description = "Foundation time series forecasting models"
license = "MIT"
name = "foundationforecast"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[tool.coverage]
branch = true
source = ["foundationforecast"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["foundationforecast"]

[tool.pytest.ini_options]
markers = [
  "models: marks tests that download model weights",
]
testpaths = ["tests"]

[tool.ruff]
fix = true
line-length = 88
src = ["foundationforecast"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["foundationforecast"]
no-lines-before = ["local-folder"]
